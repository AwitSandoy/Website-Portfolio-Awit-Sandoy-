<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 10 - Awit Sandoy</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        h2 {
            color: #1a73e8;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #5f6368;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e8eaed;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #1a73e8;
            outline: none;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button[onclick="calculate()"] {
            background-color: #1a73e8;
            color: white;
        }

        button[type="reset"] {
            background-color: #dadce0;
            color: #3c4043;
        }

        button:hover {
            opacity: 0.9;
        }

        #resultArea {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 500;
            min-height: 20px;
            text-align: left;
            line-height: 1.6;
            white-space: pre-line; /* Preserves line breaks from JS */
        }

        .result-active {
            background-color: #e8f0fe;
            color: #1967d2;
            border: 1px solid #d2e3fc;
        }
    </style>
    <script src="arithmeticOperations.js"></script>
</head>

<body>
    <div class="calculator-card">
        <h2>Arithmetic Operators</h2>
        <form id="calcForm">
            <div class="input-group">
                <label for="num1">Number 1:</label>
                <input type="text" id="num1" name="num1" placeholder="Enter first value">
            </div>
            
            <div class="input-group">
                <label for="num2">Number 2:</label>
                <input type="text" id="num2" name="num2" placeholder="Enter second value">
            </div>

            <div class="btn-container">
                <button type="button" onclick="calculate()">Calculate</button>
                <button type="reset" onclick="clearFields()">Clear</button>
            </div>
        </form>
        <div id="resultArea"></div>
    </div>
</body>
</html>
