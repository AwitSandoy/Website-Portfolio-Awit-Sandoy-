<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 2 - Awit Sandoy</title>
    <style>
        body {
            background: url("BG_act2.png") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 12px;
            max-width: 700px;
            width: 90%;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h3 {
            font-size: 28px;
            margin-bottom: 15px;
            border-left: 5px solid #2c3e50;
            padding-left: 15px;
            color: #2c3e50;
            font-family: 'Segoe UI', sans-serif;
        }

        ol.main-list {
            font-family: 'Georgia', serif;
            font-size: 22px;
            color: #0d47a1;
        }

        ol.main-list ul {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #d81b60;
            margin-top: 5px;
            font-weight: bold;
        }

        ul.bucket-list {
            font-family: 'Verdana', sans-serif;
            font-size: 20px;
            color: #1b5e20;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Ordered List: Favorite Fruits</h3>
        <ol class="main-list">
            <li>Dragon Fruit</li>
            <li>Mango
                <ul>
                    <li>Piko</li>
                    <li>Katchamita</li>
                </ul>
            </li>
            <li>Pineapple</li>
            <li>Grapes</li>
            <li>Watermelon</li>
        </ol>

        <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">

        <h3>Unordered List: Bucket List</h3>
        <ul class="bucket-list">
            <li>Manila</li>
            <li>Davao</li>
            <li>Palawan</li>
            <li>Bohol</li>
            <li>Tagaytay</li>
        </ul>
    </div>

</body>
</html>
