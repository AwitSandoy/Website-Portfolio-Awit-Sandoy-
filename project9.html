<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 9 - Awit Sandoy</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #334155;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            font-weight: 700;
            color: #1e293b;
            font-size: 1.75rem;
            margin-bottom: 24px;
        }

        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #4f46e5;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        #demo {
            margin-top: 25px;
            padding: 15px;
            min-height: 24px;
            font-size: 1.1rem;
            color: #475569;
            background-color: #f1f5f9;
            border-radius: 8px;
            border-bottom: 4px solid #6366f1; 
            display: inline-block;
            width: calc(100% - 30px);
            
            text-align: center; 
        }

        #demo:empty {
            display: none;
        }
    </style>
    <script>
        function myFunction() {
            let txt;
            let fullName = prompt("Full name :", "Enter full name here");
            if (fullName == null || fullName == "") {
                txt = "The field is required!";
            } else {
                txt = "Hello, " + fullName + "! How are you today?";
            }
            document.getElementById("demo").innerHTML = txt;
        }
    </script>
</head>
<body>

    <div class="container">
        <h2>JavaScript Prompt</h2>
        <button onclick="myFunction()">Click Here To Enter Your Name</button>
        <p id="demo"></p>
    </div>

</body>
</html>
